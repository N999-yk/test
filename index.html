<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leonida Project NATION</title>

    <!-- Chargement du design Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* Force la carte à prendre tout l'écran avec le fond bleu océan */
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #2c68a6; 
        }

        /* Applique une opacité à 75% (25% de transparence) pour le logo */
        .watermark-logo {
            opacity: 0.75;
            pointer-events: none; 
            object-fit: contain !important;
        }

        /* Style pour le curseur sur le bouton Abonnez-vous */
        .youtube-btn-link {
            cursor: pointer;
        }

        /* Style pour l'encadré des coordonnées en direct (bas gauche) */
        .coord-box {
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 6px 12px;
            font-family: monospace;
            font-size: 13px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            margin-bottom: 10px !important;
        }

        /* ==========================================
           🧭 STYLE DU MENU LATÉRAL & MOBILE
           ========================================== */
        #menu-container {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 280px;
            background: rgba(0, 0, 0, 0.82);
            color: #fff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 1000;
            font-family: sans-serif;
            backdrop-filter: blur(5px);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        #menu-container.hidden {
            transform: translateX(-110%);
            opacity: 0;
            pointer-events: none;
        }

        #menu-container h2 {
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 0.5px;
            color: #fff;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
        }

        /* Barre de recherche */
        #search-input {
            width: 100%;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            color: #fff;
            font-size: 13px;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
        }

        #search-input::placeholder {
            color: #bbb;
        }

        #search-input:focus {
            border-color: #3498db;
            background: rgba(255, 255, 255, 0.15);
        }

        /* Liste des catégories */
        .category-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            cursor: pointer;
        }

        .category-item label {
            display: flex;
            align-items: center;
            cursor: pointer;
            width: 100%;
        }

        .category-item input {
            cursor: pointer;
            margin-right: 10px;
            transform: scale(1.1);
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        /* Bouton d'ouverture/fermeture mobile */
        #toggle-menu-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
            z-index: 999;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            display: none; /* Affiché dynamiquement ou géré proprement */
        }

        /* Adaptation mobile */
        @media (max-width: 768px) {
            #menu-container {
                width: calc(100% - 70px);
                max-width: 300px;
                top: 10px;
                left: 10px;
            }
            #toggle-menu-btn {
                display: block;
                left: 10px;
                top: 10px;
            }
            /* Si le menu est ouvert sur mobile, on décale un peu le bouton ou on le gère */
        }
    </style>
</head>
<body>

    <!-- Bouton pour ouvrir/fermer le menu sur mobile -->
    <button id="toggle-menu-btn" onclick="toggleMenu()">📂 Menu</button>

    <!-- Menu Encadré Gauche -->
    <div id="menu-container">
        <h2>Filtres et Recherche</h2>
        
        <!-- Barre de recherche -->
        <input type="text" id="search-input" placeholder="Rechercher (ex: crocodile)..." onkeyup="filterMarkers()">

        <!-- Liste des catégories avec interrupteurs On/Off -->
        <div class="category-item">
            <label>
                <input type="checkbox" id="cat-green" checked onchange="filterMarkers()">
                <span class="dot" style="background: #2ecc71;"></span> Faune et Flore
            </label>
        </div>
        <div class="category-item">
            <label>
                <input type="checkbox" id="cat-blue" checked onchange="filterMarkers()">
                <span class="dot" style="background: #3498db;"></span> Objets Cachés
            </label>
        </div>
        <div class="category-item">
            <label>
                <input type="checkbox" id="cat-red" checked onchange="filterMarkers()">
                <span class="dot" style="background: #e74c3c;"></span> Véhicules Cachés
            </label>
        </div>
        <div class="category-item">
            <label>
                <input type="checkbox" id="cat-orange" checked onchange="filterMarkers()">
                <span class="dot" style="background: #e67e22;"></span> Spots et Lieux Cachés
            </label>
        </div>
        <div class="category-item">
            <label>
                <input type="checkbox" id="cat-violet" checked onchange="filterMarkers()">
                <span class="dot" style="background: #9b59b6;"></span> Secrets et Mystères
            </label>
        </div>
    </div>

    <!-- Conteneur de la carte -->
    <div id="map"></div>

    <!-- Chargement du moteur Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Initialisation de la carte avec les niveaux de zoom et le système à plat
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: 0,
            maxZoom: 5
        });

        // Chargement des tuiles JPG avec l'ordre inversé et le paramètre tms
        L.tileLayer('{z}/{z},{y},{x}.jpg', {
            minZoom: 0,
            maxZoom: 5,
            tms: true,
            attribution: 'Leonida Project NATION'
        }).addTo(map);

        // Définition de l'espace total de la carte en pixels
        var southWest = map.unproject([-400, 1124], 0);
        var northEast = map.unproject([1424, -100], 0);
        var bounds = L.latLngBounds(southWest, northEast);

        map.setMaxBounds(bounds);
        
        var center = map.unproject([512, 512], 0);
        map.setView(center, 0);

        // ==========================================
        // 🏴 LOGO & BOUTON YOUTUBE CLIQUABLE (ZOOM 0 & 1)
        // ==========================================
        var logoUrl = 'logo.png';

        var logoBounds = L.latLngBounds(
            map.unproject([700, 200], 0),   
            map.unproject([1250, 750], 0)   
        );

        var logoOverlay = L.imageOverlay(logoUrl, logoBounds, {
            className: 'watermark-logo',
            interactive: false
        });

        var youtubeBtnBounds = L.latLngBounds(
            map.unproject([1110, 700], 0),  
            map.unproject([1240, 745], 0)   
        );

        var youtubeBtnOverlay = L.rectangle(youtubeBtnBounds, {
            stroke: false,
            fillOpacity: 0,
            className: 'youtube-btn-link',
            interactive: true
        });

        youtubeBtnOverlay.on('click', function() {
            window.open('https://www.youtube.com/@NATIONtmcp', '_blank');
        });

        function updateLogoVisibility() {
            var currentZoom = map.getZoom();
            if (currentZoom <= 1) {
                if (!map.hasLayer(logoOverlay)) {
                    logoOverlay.addTo(map);
                    youtubeBtnOverlay.addTo(map);
                }
            } else {
                if (map.hasLayer(logoOverlay)) {
                    map.removeLayer(logoOverlay);
                    map.removeLayer(youtubeBtnOverlay);
                }
            }
        }

        map.on('zoomend', updateLogoVisibility);
        updateLogoVisibility();

        // ==========================================
        // 📍 OUTIL DE REPÉRAGE DE COORDONNÉES (EN DIRECT)
        // ==========================================
        var coordControl = L.control({position: 'bottomleft'});
        coordControl.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'coord-box');
            div.innerHTML = 'X: 0 | Y: 0';
            return div;
        };
        coordControl.addTo(map);

        map.on('mousemove', function(e) {
            var point = map.project(e.latlng, 0);
            var x = Math.round(point.x);
            var y = Math.round(point.y);
            document.querySelector('.coord-box').innerHTML = `X: ${x} | Y: ${y}`;
        });

        // ==========================================
        // 🔴 CRÉATION DES ICÔNES DE COULEURS
        // ==========================================
        var icons = {
            red: new L.Icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
                iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
            }),
            blue: new L.Icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
                iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
            }),
            green: new L.Icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
                iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
            }),
            orange: new L.Icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
                iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
            }),
            violet: new L.Icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-violet.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
                iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
            })
        };

        // Tableau centralisé de tous nos marqueurs avec leur catégorie et leur texte (pour la recherche)
        var allMarkers = [
            // VERT : Faune et Flore
            {
                latlng: map.unproject([800, 600], 0),
                category: 'green',
                title: "Réserve Naturelle",
                desc: "Zone forestière protégée et observation de crocodiles sauvages."
            },
            {
                latlng: map.unproject([150, 900], 0),
                category: 'green',
                title: "Domaine Agricole",
                desc: "Terres cultivables de l'Ouest."
            },

            // BLEU : Objets Cachés
            {
                latlng: map.unproject([200, 400], 0),
                category: 'blue',
                title: "Zone Portuaire",
                desc: "Arrivée des marchandises et caisses suspectes."
            },
            {
                latlng: map.unproject([650, 300], 0),
                category: 'blue',
                title: "Poste de Sécurité Nord",
                desc: "Contrôle maritime et équipements."
            },

            // ROUGE : Véhicules Cachés
            {
                latlng: map.unproject([512, 512], 0),
                category: 'red',
                title: "Capitale de Leonida",
                desc: "Le cœur de la nation et point de départ de véhicules d'exception."
            },
            {
                latlng: map.unproject([300, 700], 0),
                category: 'red',
                title: "Avant-poste de l'Est",
                desc: "Zone militaire sous haute surveillance avec véhicules blindés."
            },

            // ORANGE : Spots et Lieux Cachés
            {
                latlng: map.unproject([450, 200], 0),
                category: 'orange',
                title: "Chantier Industriel",
                desc: "Zone de construction en cours, point d'observation en hauteur."
            },
            {
                latlng: map.unproject([900, 450], 0),
                category: 'orange',
                title: "Dépôt de Carburant",
                desc: "Ravitaillement principal isolé des routes."
            },

            // VIOLET : Secrets et Mystères
            {
                latlng: map.unproject([750, 850], 0),
                category: 'violet',
                title: "Quartier VIP / Casino",
                desc: "Zone de divertissement nocturne et secrets de bas-fonds."
            },
            {
                latlng: map.unproject([350, 250], 0),
                category: 'violet',
                title: "Laboratoire Secret",
                desc: "Recherches top-secret abandonnées."
            }
        ];

        // Couche de groupe Leaflet pour gérer l'affichage global
        var markersGroup = L.layerGroup().addTo(map);

        // Fonction d'affichage et de filtrage (Catégories + Recherche textuelle)
        function filterMarkers() {
            markersGroup.clearLayers(); // On efface tout de la carte

            // Récupération de l'état des cases à cocher
            var showGreen = document.getElementById('cat-green').checked;
            var showBlue = document.getElementById('cat-blue').checked;
            var showRed = document.getElementById('cat-red').checked;
            var showOrange = document.getElementById('cat-orange').checked;
            var showViolet = document.getElementById('cat-violet').checked;

            // Récupération du texte de recherche (mis en minuscules pour ne pas être sensible à la casse)
            var searchText = document.getElementById('search-input').value.toLowerCase().trim();

            allMarkers.forEach(function(item) {
                // 1. Vérification du filtre de catégorie (On/Off)
                var categoryVisible = false;
                if (item.category === 'green' && showGreen) categoryVisible = true;
                if (item.category === 'blue' && showBlue) categoryVisible = true;
                if (item.category === 'red' && showRed) categoryVisible = true;
                if (item.category === 'orange' && showOrange) categoryVisible = true;
                if (item.category === 'violet' && showViolet) categoryVisible = true;

                if (!categoryVisible) return; // Si la catégorie est désactivée, on passe au suivant

                // 2. Vérification de la recherche textuelle (titre ou description)
                if (searchText !== "") {
                    var matchTitle = item.title.toLowerCase().includes(searchText);
                    var matchDesc = item.desc.toLowerCase().includes(searchText);
                    if (!matchTitle && !matchDesc) {
                        return; // Si le texte ne correspond ni au titre ni à la desc, on masque
                    }
                }

                // 3. Si tout est bon, on crée et ajoute le marqueur sur la carte
                var marker = L.marker(item.latlng, { icon: icons[item.category] });
                marker.bindPopup(`<b>${item.title}</b><br>${item.desc}`);
                markersGroup.addLayer(marker);
            });
        }

        // Lancement initial pour afficher tous les marqueurs au chargement
        filterMarkers();

        // ==========================================
        // 📱 FONCTION POUR OUVRIR/FERMER LE MENU SUR MOBILE
        // ==========================================
        function toggleMenu() {
            var menu = document.getElementById('menu-container');
            var btn = document.getElementById('toggle-menu-btn');
            menu.classList.toggle('hidden');
            if (menu.classList.contains('hidden')) {
                btn.innerHTML = "📂 Menu";
            } else {
                btn.innerHTML = "❌ Fermer";
            }
        }

        // Empêche les clics sur le menu de bouger la carte en dessous
        var menuElement = document.getElementById('menu-container');
        L.DomEvent.disableClickPropagation(menuElement);
        L.DomEvent.disableScrollPropagation(menuElement);

        // ------------------------------------------
        // Empêche les bugs de décalage au premier chargement complet
        // ------------------------------------------
        setTimeout(function() {
            map.invalidateSize();
        }, 100);
    </script>

</body>
</html>
