<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Carte en Tuiles</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #111;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Initialisation avec CRS.Simple
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: 0,
            maxZoom: 5,
            zoomControl: true
        });

        // 2. Définition de la taille totale de la map en pixels pour forcer Leaflet à voir grand 
        // (Basé sur vos coordonnées max approximatives : x=99, y=78 au zoom 5 -> 100 * 256 = 25600 pixels)
        var w = 25600; 
        var h = 20480;
        
        var southWest = map.unproject([0, h], 5);
        var northEast = map.unproject([w, 0], 5);
        var bounds = new L.LatLngBounds(southWest, northEast);

        map.setMaxBounds(bounds);

        // 3. Chargement des tuiles
        L.tileLayer('{z}/{x},{y},{z}.jpg', {
            minZoom: 0,
            maxZoom: 5,
            tileSize: 256,
            noWrap: true,
            bounds: bounds,
            attribution: 'Ma Map'
        }).addTo(map);

        // 4. Centrage initial au milieu de la map pour voir tout le monde
        map.fitBounds(bounds);
    </script>
</body>
</html>
