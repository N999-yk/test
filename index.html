<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leonida Project NATION</title>

    <!-- Chargement du design Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* Force la carte à prendre tout l'écran avec le fond bleu océan */
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #2c68a6; 
        }

        /* Applique une opacité à 75% (25% de transparence) pour le logo */
        .watermark-logo {
            opacity: 0.75;
            pointer-events: none; 
            object-fit: contain !important;
        }

        /* Style pour le curseur sur le bouton Abonnez-vous */
        .youtube-btn-link {
            cursor: pointer;
        }

        /* Style pour l'encadré des coordonnées en direct (bas gauche) */
        .coord-box {
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 6px 12px;
            font-family: monospace;
            font-size: 13px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        /* ==========================================
           🧭 STYLE DU MENU "FILTRES ET RECHERCHE"
           ========================================== */
        .filter-menu {
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px;
            font-family: sans-serif;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 260px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .filter-menu h3 {
            margin: 0 0 12px 0;
            font-size: 16px;
            text-align: center;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 8px;
            letter-spacing: 0.5px;
        }

        /* Barre de recherche */
        .search-container {
            margin-bottom: 15px;
        }

        .search-container input {
            width: 100%;
            padding: 8px 10px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-container input:focus {
            border-color: #2c68a6;
        }

        .search-container input::placeholder {
            color: #aaa;
        }

        /* Liste des catégories */
        .category-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .category-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 10px;
            border-radius: 4px;
        }

        .category-item span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Indicateur de couleur miniature */
        .color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        /* Bouton Switch ON / OFF customisé */
        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #555;
            transition: .3s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #2ecc71;
        }

        input:checked + .slider:before {
            transform: translateX(16px);
        }
    </style>
</head>
<body>

    <!-- Conteneur de la carte -->
    <div id="map"></div>

    <!-- Chargement du moteur Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Initialisation de la carte avec les niveaux de zoom et le système à plat
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: 0,
            maxZoom: 5
        });

        // Chargement des tuiles JPG avec l'ordre inversé et le paramètre tms
        L.tileLayer('{z}/{z},{y},{x}.jpg', {
            minZoom: 0,
            maxZoom: 5,
            tms: true,
            attribution: 'Leonida Project NATION'
        }).addTo(map);

        // Définition de l'espace total de la carte en pixels
        var southWest = map.unproject([-400, 1124], 0);
        var northEast = map.unproject([1424, -100], 0);
        var bounds = L.latLngBounds(southWest, northEast);

        map.setMaxBounds(bounds);
        
        var center = map.unproject([512, 512], 0);
        map.setView(center, 0);

        // ==========================================
        // 🏴 LOGO & BOUTON YOUTUBE CLIQUABLE (ZOOM 0 & 1)
        // ==========================================
        var logoUrl = 'logo.png';

        var logoBounds = L.latLngBounds(
            map.unproject([700, 200], 0),
            map.unproject([1250, 750], 0)
        );

        var logoOverlay = L.imageOverlay(logoUrl, logoBounds, {
            className: 'watermark-logo',
            interactive: false
        });

        var youtubeBtnBounds = L.latLngBounds(
            map.unproject([1110, 700], 0),
            map.unproject([1240, 745], 0)
        );

        var youtubeBtnOverlay = L.rectangle(youtubeBtnBounds, {
            stroke: false,
            fillOpacity: 0,
            className: 'youtube-btn-link',
            interactive: true
        });

        youtubeBtnOverlay.on('click', function() {
            window.open('https://www.youtube.com/@NATIONtmcp', '_blank');
        });

        function updateLogoVisibility() {
            var currentZoom = map.getZoom();
            if (currentZoom <= 1) {
                if (!map.hasLayer(logoOverlay)) {
                    logoOverlay.addTo(map);
                    youtubeBtnOverlay.addTo(map);
                }
            } else {
                if (map.hasLayer(logoOverlay)) {
                    map.removeLayer(logoOverlay);
                    map.removeLayer(youtubeBtnOverlay);
                }
            }
        }

        map.on('zoomend', updateLogoVisibility);
        updateLogoVisibility();

        // ==========================================
        // 📍 OUTIL DE REPÉRAGE DE COORDONNÉES (EN DIRECT)
        // ==========================================
        var coordControl = L.control({position: 'bottomleft'});
        coordControl.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'coord-box');
            div.innerHTML = 'X: 0 | Y: 0';
            return div;
        };
        coordControl.addTo(map);

        map.on('mousemove', function(e) {
            var point = map.project(e.latlng, 0);
            var x = Math.round(point.x);
            var y = Math.round(point.y);
            document.querySelector('.coord-box').innerHTML = `X: ${x} | Y: ${y}`;
        });

        // ==========================================
        // 🎨 CONFIGURATION DES ICÔNES DE COULEUR
        // ==========================================
        var icons = {
            green: new L.Icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
                iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
            }),
            blue: new L.Icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
                iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
            }),
            red: new L.Icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
                iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
            }),
            orange: new L.Icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
                iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
            }),
            violet: new L.Icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-violet.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
                iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
            })
        };

        // ==========================================
        // 📌 LISTE DE TOUS LES MARQUEURS ET CATÉGORIES
        // ==========================================
        // Chaque marqueur possède une catégorie, un titre, une description et son objet Leaflet
        var markersData = [
            // --- VERT : Faune et Flore ---
            {
                category: 'green',
                title: 'Marais aux Crocodiles',
                desc: 'Attention aux prédateurs dans les zones humides.',
                latlng: map.unproject([512, 512], 0)
            },
            {
                category: 'green',
                title: 'Réserve Naturelle de l’Ouest',
                desc: 'Zone forestière protégée riche en espèces rares.',
                latlng: map.unproject([150, 900], 0)
            },

            // --- BLEU : Objets Cachés ---
            {
                category: 'blue',
                title: 'Caisse de Ravitaillement',
                desc: 'Contient des équipements rares et des munitions.',
                latlng: map.unproject([200, 400], 0)
            },
            {
                category: 'blue',
                title: 'Paquet Caché #12',
                desc: 'Dissimulé derrière les caisses du hangar.',
                latlng: map.unproject([650, 300], 0)
            },

            // --- ROUGE : Véhicules Cachés ---
            {
                category: 'red',
                title: 'Capitale de Leonida (Véhicule civil)',
                desc: 'Berline rapide garée au cœur de la nation.',
                latlng: map.unproject([300, 700], 0)
            },
            {
                category: 'red',
                title: 'Avant-poste Militaire (Blindé)',
                desc: 'Véhicule tactique sous haute surveillance.',
                latlng: map.unproject([800, 250], 0)
            },

            // --- ORANGE : Spots et Lieux Cachés ---
            {
                category: 'orange',
                title: 'Chantier Industriel Abandonné',
                desc: 'Idéal pour se planquer en cas de course-poursuite.',
                latlng: map.unproject([450, 200], 0)
            },
            {
                category: 'orange',
                title: 'Dépôt de Carburant',
                desc: 'Point stratégique hautement inflammable.',
                latlng: map.unproject([900, 450], 0)
            },

            // --- VIOLET : Secrets et Mystères ---
            {
                category: 'violet',
                title: 'Quartier VIP / Casino',
                desc: 'Lieu de rassemblement nocturne et mystérieux.',
                latlng: map.unproject([750, 850], 0)
            },
            {
                category: 'violet',
                title: 'Laboratoire Secret',
                desc: 'Expériences top-secret menées dans la pénombre.',
                latlng: map.unproject([350, 250], 0)
            }
        ];

        // Tableau pour stocker les instances Leaflet des marqueurs sur la carte
        var activeMarkers = [];

        function renderMarkers() {
            // Nettoie les marqueurs existants
            activeMarkers.forEach(function(item) {
                map.removeLayer(item.marker);
            });
            activeMarkers = [];

            var searchQuery = document.getElementById('search-input').value.toLowerCase();

            markersData.forEach(function(data) {
                // Vérifie si le switch de la catégorie est activé (ON)
                var isCategoryOn = document.getElementById('switch-' + data.category).checked;

                // Vérifie si le texte correspond à la recherche (titre ou description)
                var matchesSearch = data.title.toLowerCase().includes(searchQuery) || 
                                    data.desc.toLowerCase().includes(searchQuery);

                // Le marqueur s'affiche s'il respecte le filtre de catégorie ET la recherche
                if (isCategoryOn && matchesSearch) {
                    var marker = L.marker(data.latlng, { icon: icons[data.category] }).addTo(map);
                    marker.bindPopup(`<b>${data.title}</b><br>${data.desc}`);
                    activeMarkers.push({ marker: marker, category: data.category });
                }
            });
        }

        // ==========================================
        // 🧭 CRÉATION DU MENU INTERactif (TOPLEFT)
        // ==========================================
        var menuControl = L.control({ position: 'topleft' });

        menuControl.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'filter-menu');
            div.innerHTML = `
                <h3>Filtres et Recherche</h3>
                
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="Rechercher (ex: crocodile)..." oninput="renderMarkers()">
                </div>

                <div class="category-list">
                    <div class="category-item">
                        <span><span class="color-dot" style="background-color: #2ecc71;"></span> Faune et Flore</span>
                        <label class="switch">
                            <input type="checkbox" id="switch-green" checked onchange="renderMarkers()">
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="category-item">
                        <span><span class="color-dot" style="background-color: #3498db;"></span> Objets Cachés</span>
                        <label class="switch">
                            <input type="checkbox" id="switch-blue" checked onchange="renderMarkers()">
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="category-item">
                        <span><span class="color-dot" style="background-color: #e74c3c;"></span> Véhicules Cachés</span>
                        <label class="switch">
                            <input type="checkbox" id="switch-red" checked onchange="renderInstaller || true" checked onchange="renderMarkers()">
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="category-item">
                        <span><span class="color-dot" style="background-color: #e67e22;"></span> Spots et Lieux Cachés</span>
                        <label class="switch">
                            <input type="checkbox" id="switch-orange" checked onchange="renderMarkers()">
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="category-item">
                        <span><span class="color-dot" style="background-color: #9b59b6;"></span> Secrets et Mystères</span>
                        <label class="switch">
                            <input type="checkbox" id="switch-violet" checked onchange="renderMarkers()">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            `;

            // Empêche les clics sur le menu de bouger la carte en arrière-plan
            L.DomEvent.disableClickPropagation(div);
            L.DomEvent.disableScrollPropagation(div);

            return div;
        };

        menuControl.addTo(map);

        // Affichage initial des marqueurs au chargement
        renderMarkers();

        // ------------------------------------------
        // Empêche les bugs de décalage au premier chargement complet
        setTimeout(function() {
            map.invalidateSize();
        }, 100);
    </script>

</body>
</html>
