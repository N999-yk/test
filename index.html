<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leonida Project NATION</title>

    <!-- Chargement du design Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* Force la carte à prendre tout l'écran avec le fond bleu océan */
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #2c68a6; 
        }

        /* Applique une opacité à 75% (25% de transparence) sur le logo */
        .watermark-logo {
            opacity: 0.75;
            pointer-events: none; 
            object-fit: contain !important;
        }

        /* Style pour le curseur sur le bouton Abonnez-vous */
        .youtube-btn-link {
            cursor: pointer;
        }

        /* Style pour l'encadré des coordonnées en direct (bas gauche) */
        .coord-box {
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 6px 12px;
            font-family: monospace;
            font-size: 13px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        /* ==========================================
           🧭 STYLE DU MENU LATÉRAL GAUCHE
           ========================================== */
        .map-menu {
            background: rgba(20, 30, 45, 0.9);
            color: #fff;
            padding: 15px;
            font-family: sans-serif;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 280px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .map-menu h3 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 16px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 8px;
            color: #ffcc00;
        }

        .search-container {
            margin-bottom: 15px;
        }

        .search-container input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #4a6fa5;
            border-radius: 4px;
            color: #fff;
            font-size: 13px;
        }

        .search-container input:focus {
            outline: none;
            border-color: #ffcc00;
        }

        .category-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 10px;
            border-radius: 4px;
        }

        .category-item label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-item input[type="checkbox"] {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }
    </style>
</head>
<body>

    <!-- Conteneur de la carte -->
    <div id="map"></div>

    <!-- Chargement du moteur Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Initialisation de la carte avec les niveaux de zoom et le système à plat
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: 0,
            maxZoom: 5
        });

        // Chargement des tuiles JPG avec l'ordre inversé et le paramètre tms
        L.tileLayer('{z}/{z},{y},{x}.jpg', {
            minZoom: 0,
            maxZoom: 5,
            tms: true,
            attribution: 'Leonida Project NATION'
        }).addTo(map);

        // Définition de l'espace total de la carte en pixels
        var southWest = map.unproject([-400, 1124], 0);
        var northEast = map.unproject([1424, -100], 0);
        var bounds = L.latLngBounds(southWest, northEast);

        map.setMaxBounds(bounds);
        
        // Conversion et centrage initial
        var center = map.unproject([512, 512], 0);
        map.setView(center, 0);

        // ==========================================
        // 🏴 LOGO & BOUTON YOUTUBE CLIQUABLE (ZOOM 0 & 1)
        // ==========================================
        var logoUrl = 'logo.png';

        var logoBounds = L.latLngBounds(
            map.unproject([700, 200], 0),
            map.unproject([1250, 750], 0)
        );

        var logoOverlay = L.imageOverlay(logoUrl, logoBounds, {
            className: 'watermark-logo',
            interactive: false
        });

        var youtubeBtnBounds = L.latLngBounds(
            map.unproject([1110, 700], 0),
            map.unproject([1240, 745], 0)
        );

        var youtubeBtnOverlay = L.rectangle(youtubeBtnBounds, {
            stroke: false,
            fillOpacity: 0,
            className: 'youtube-btn-link',
            interactive: true
        });

        youtubeBtnOverlay.on('click', function() {
            window.open('https://www.youtube.com/@NATIONtmcp', '_blank');
        });

        function updateLogoVisibility() {
            var currentZoom = map.getZoom();
            if (currentZoom <= 1) {
                if (!map.hasLayer(logoOverlay)) {
                    logoOverlay.addTo(map);
                    youtubeBtnOverlay.addTo(map);
                }
            } else {
                if (map.hasLayer(logoOverlay)) {
                    map.removeLayer(logoOverlay);
                    map.removeLayer(youtubeBtnOverlay);
                }
            }
        }

        map.on('zoomend', updateLogoVisibility);
        updateLogoVisibility();

        // ==========================================
        // 📍 OUTIL DE REPÉRAGE DE COORDONNÉES (EN DIRECT)
        // ==========================================
        var coordControl = L.control({position: 'bottomleft'});
        coordControl.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'coord-box');
            div.innerHTML = 'X: 0 | Y: 0';
            return div;
        };
        coordControl.addTo(map);

        map.on('mousemove', function(e) {
            var point = map.project(e.latlng, 0);
            var x = Math.round(point.x);
            var y = Math.round(point.y);
            document.querySelector('.coord-box').innerHTML = `X: ${x} | Y: ${y}`;
        });

        // ==========================================
        // 🎨 CONFIGURATION DES ICÔNES DE COULEUR
        // ==========================================
        var shadowUrl = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png';
        
        var icons = {
            green: new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png', shadowUrl: shadowUrl, iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41] }),
            blue: new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png', shadowUrl: shadowUrl, iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41] }),
            red: new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png', shadowUrl: shadowUrl, iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41] }),
            orange: new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png', shadowUrl: shadowUrl, iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41] }),
            violet: new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-violet.png', shadowUrl: shadowUrl, iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41] })
        };

        // ==========================================
        // 📋 LISTE CENTRALISÉE DE TOUS LES MARQUEURS
        // ==========================================
        // Chaque marqueur possède ses coordonnées, sa catégorie, un titre et une description (utile pour la recherche)
        var markersData = [
            // --- VERT : Faune et Flore ---
            {
                category: 'green',
                coords: [512, 512],
                title: "Capitale de Leonida",
                desc: "Le cœur de la nation et point de départ."
            },
            {
                category: 'green',
                coords: [800, 600],
                title: "Réserve Naturelle",
                desc: "Zone forestière protégée abritant un crocodile géant."
            },
            {
                category: 'green',
                coords: [150, 900],
                title: "Domaine Agricole",
                desc: "Terres cultivables de l'Ouest."
            },

            // --- BLEU : Objets Cachés ---
            {
                category: 'blue',
                coords: [200, 400],
                title: "Zone Portuaire",
                desc: "Arrivée des marchandises et caisses cachées."
            },
            {
                category: 'blue',
                coords: [650, 300],
                title: "Poste de Sécurité Nord",
                desc: "Contrôle maritime et objets de contrebande."
            },

            // --- ROUGE : Véhicules Cachés ---
            {
                category: 'red',
                coords: [300, 700],
                title: "Avant-poste de l'Est",
                desc: "Zone militaire sous haute surveillance avec véhicules blindés."
            },
            {
                category: 'red',
                coords: [450, 200],
                title: "Chantier Industriel",
                desc: "Engins de chantier et camions spéciaux abandonnés."
            },

            // --- ORANGE : Spots et Lieux Cachés ---
            {
                category: 'orange',
                coords: [900, 450],
                title: "Dépôt de Carburant",
                desc: "Ravitaillement principal et spot de saut en parachute."
            },
            {
                category: 'orange',
                coords: [350, 250],
                title: "Belvédère de la falaise",
                desc: "Panorama exceptionnel sur toute la baie."
            },

            // --- VIOLET : Secrets et Mystères ---
            {
                category: 'violet',
                coords: [750, 850],
                title: "Quartier VIP / Casino",
                desc: "Zone de divertissement nocturne et énigme mystérieuse."
            },
            {
                category: 'violet',
                coords: [150, 200],
                title: "Laboratoire Secret",
                desc: "Recherches top-secret abandonnées dans les marais."
            }
        ];

        // Tableau pour stocker les objets Leaflet des marqueurs sur la carte
        var activeMarkers = [];

        // Fonction pour afficher tous les marqueurs selon l'état des filtres et de la recherche
        function renderMarkers() {
            // Supprime les marqueurs actuels de la carte
            activeMarkers.forEach(function(item) {
                map.removeLayer(item.marker);
            });
            activeMarkers = [];

            // Récupère l'état des checkboxes du menu
            var showGreen = document.getElementById('filter-green').checked;
            var showBlue = document.getElementById('filter-blue').checked;
            var showRed = document.getElementById('filter-red').checked;
            var showOrange = document.getElementById('filter-orange').checked;
            var showViolet = document.getElementById('filter-violet').checked;

            // Récupère le texte de recherche en minuscules
            var searchText = document.getElementById('search-input').value.toLowerCase();

            // Parcourt la liste de tous les marqueurs
            markersData.forEach(function(data) {
                // 1. Vérifie le filtre de catégorie (On/Off)
                var categoryVisible = false;
                if (data.category === 'green' && showGreen) categoryVisible = true;
                if (data.category === 'blue' && showBlue) categoryVisible = true;
                if (data.category === 'red' && showRed) categoryVisible = true;
                if (data.category === 'orange' && showOrange) categoryVisible = true;
                if (data.category === 'violet' && showViolet) categoryVisible = true;

                if (!categoryVisible) return; // Ignore si la catégorie est désactivée

                // 2. Vérifie la recherche par mot-clé (dans le titre ou la description)
                var fullText = (data.title + " " + data.desc).toLowerCase();
                if (searchText && !fullText.includes(searchText)) {
                    return; // Ignore si le mot recherché n'y est pas
                }

                // 3. Crée et ajoute le marqueur sur la carte
                var marker = L.marker(map.unproject(data.coords, 0), { icon: icons[data.category] }).addTo(map);
                marker.bindPopup(`<b>${data.title}</b><br>${data.desc}`);

                activeMarkers.push({ marker: marker, data: data });
            });
        }

        // ==========================================
        // 🧭 CRÉATION DU MENU FLOTTANT (GAUCHE)
        // ==========================================
        var menuControl = L.control({position: 'topleft'});
        menuControl.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'map-menu');
            div.innerHTML = `
                <h3>Filtres & Recherche</h3>
                
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="🔍 Rechercher (ex: crocodile)..." oninput="renderMarkers()">
                </div>

                <div class="category-item">
                    <label style="color: #4ade80;">
                        <input type="checkbox" id="filter-green" checked onchange="renderMarkers()"> Faune et Flore
                    </label>
                </div>

                <div class="category-item">
                    <label style="color: #60a5fa;">
                        <input type="checkbox" id="filter-blue" checked onchange="renderMarkers()"> Objets Cachés
                    </label>
                </div>

                <div class="category-item">
                    <label style="color: #f87171;">
                        <input type="checkbox" id="filter-red" checked onchange="renderMarkers()"> Véhicules Cachés
                    </label>
                </div>

                <div class="category-item">
                    <label style="color: #fb923c;">
                        <input type="checkbox" id="filter-orange" checked onchange="renderMarkers()"> Spots et Lieux Cachés
                    </label>
                </div>

                <div class="category-item">
                    <label style="color: #c084fc;">
                        <input type="checkbox" id="filter-violet" checked onchange="renderMarkers()"> Secrets et Mystères
                    </label>
                </div>
            `;

            // Empêche les clics sur le menu de bouger la carte en arrière-plan
            L.DomEvent.disableClickPropagation(div);
            L.DomEvent.disableScrollPropagation(div);

            return div;
        };
        menuControl.addTo(map);

        // Chargement initial des marqueurs au démarrage
        setTimeout(function() {
            renderMarkers();
            map.invalidateSize();
        }, 100);
    </script>

</body>
</html>
