<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leonida Project NATION</title>

    <!-- Chargement du design Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* Force la carte à prendre tout l'écran avec le fond bleu océan */
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #2c68a6; 
        }

        /* Applique une opacité à 75% (25% de transparence), 
            permet de cliquer à travers le logo global et conserve les proportions */
        .watermark-logo {
            opacity: 0.75;
            pointer-events: none; 
            object-fit: contain !important;
        }

        /* Style pour le curseur sur le bouton Abonnez-vous */
        .youtube-btn-link {
            cursor: pointer;
        }

        /* Style pour l'encadré des coordonnées en direct */
        .coord-box {
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 6px 12px;
            font-family: monospace;
            font-size: 13px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- Conteneur de la carte -->
    <div id="map"></div>

    <!-- Chargement du moteur Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Initialisation de la carte avec les niveaux de zoom et le système à plat
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: 0,
            maxZoom: 5
        });

        // Chargement des tuiles JPG avec l'ordre inversé et le paramètre tms
        L.tileLayer('{z}/{z},{y},{x}.jpg', {
            minZoom: 0,
            maxZoom: 5,
            tms: true,
            attribution: 'Leonida Project NATION'
        }).addTo(map);

        // Définition de l'espace total de la carte en pixels
        var southWest = map.unproject([-400, 1124], 0);
        var northEast = map.unproject([1424, -100], 0);
        var bounds = L.latLngBounds(southWest, northEast);

        map.setMaxBounds(bounds);
        
        // 1. Conversion correcte du pixel central (512, 512) en coordonnées de la carte
        var center = map.unproject([512, 512], 0);

        // 2. Application du centrage initial
        map.setView(center, 0);

        // ==========================================
        // 🏴 LOGO & BOUTON YOUTUBE CLIQUABLE (ZOOM 0 & 1)
        // ==========================================
        var logoUrl = 'logo.png'; // Pense à mettre le bon nom de fichier de ton image

        var logoBounds = L.latLngBounds(
            map.unproject([700, 200], 0),   // Coin haut-gauche
            map.unproject([1250, 750], 0)   // Coin bas-droit
        );

        var logoOverlay = L.imageOverlay(logoUrl, logoBounds, {
            className: 'watermark-logo',
            interactive: false
        });

        // Zone cliquable invisible calée exactement sur le bouton "ABONNEZ-VOUS" en bas à droite du logo
        var youtubeBtnBounds = L.latLngBounds(
            map.unproject([1110, 700], 0),  // Coin haut-gauche du bouton
            map.unproject([1240, 745], 0)   // Coin bas-droit du bouton
        );

        var youtubeBtnOverlay = L.rectangle(youtubeBtnBounds, {
            stroke: false,
            fillOpacity: 0,
            className: 'youtube-btn-link',
            interactive: true
        });

        // Redirection vers ta chaîne YouTube au clic sur le bouton
        youtubeBtnOverlay.on('click', function() {
            window.open('https://www.youtube.com/@NATIONtmcp', '_blank');
        });

        // Fonction pour afficher/cacher le logo ET le bouton cliquable selon le niveau de zoom
        function updateLogoVisibility() {
            var currentZoom = map.getZoom();
            if (currentZoom <= 1) {
                if (!map.hasLayer(logoOverlay)) {
                    logoOverlay.addTo(map);
                    youtubeBtnOverlay.addTo(map);
                }
            } else {
                if (map.hasLayer(logoOverlay)) {
                    map.removeLayer(logoOverlay);
                    map.removeLayer(youtubeBtnOverlay);
                }
            }
        }

        // Écoute les changements de zoom
        map.on('zoomend', updateLogoVisibility);
        updateLogoVisibility(); // Vérification au chargement

        // ==========================================
        // 📍 OUTIL DE REPÉRAGE DE COORDONNÉES (EN DIRECT)
        // ==========================================
        var coordControl = L.control({position: 'bottomleft'});
        coordControl.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'coord-box');
            div.innerHTML = 'X: 0 | Y: 0';
            return div;
        };
        coordControl.addTo(map);

        map.on('mousemove', function(e) {
            var point = map.project(e.latlng, 0);
            var x = Math.round(point.x);
            var y = Math.round(point.y);
            document.querySelector('.coord-box').innerHTML = `X: ${x} | Y: ${y}`;
        });

        // ==========================================
        // 🔴 CONFIGURATION DES POINTS DE REPÈRE ROUGES
        // ==========================================
        var redIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        var marker1 = L.marker(map.unproject([512, 512], 0), {icon: redIcon}).addTo(map);
        marker1.bindPopup("<b>Capitale de Leonida</b><br>Le cœur de la nation et point de départ.");

        var marker2 = L.marker(map.unproject([300, 700], 0), {icon: redIcon}).addTo(map);
        marker2.bindPopup("<b>Avant-poste de l'Est</b><br>Zone militaire sous haute surveillance.");

        // ==========================================
        // 🔵 CONFIGURATION DES POINTS DE REPÈRE BLEUS
        // ==========================================
        var blueIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        var blueMarker1 = L.marker(map.unproject([200, 400], 0), {icon: blueIcon}).addTo(map);
        blueMarker1.bindPopup("<b>Zone Portuaire</b><br>Arrivée des marchandises.");

        var blueMarker2 = L.marker(map.unproject([650, 300], 0), {icon: blueIcon}).addTo(map);
        blueMarker2.bindPopup("<b>Poste de Sécurité Nord</b><br>Contrôle maritime.");

        // ==========================================
        // 🟢 CONFIGURATION DES POINTS DE REPÈRE VERTS
        // ==========================================
        var greenIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        var greenMarker1 = L.marker(map.unproject([800, 600], 0), {icon: greenIcon}).addTo(map);
        greenMarker1.bindPopup("<b>Réserve Naturelle</b><br>Zone forestière protégée.");

        var greenMarker2 = L.marker(map.unproject([150, 900], 0), {icon: greenIcon}).addTo(map);
        greenMarker2.bindPopup("<b>Domaine Agricole</b><br>Terres cultivables de l'Ouest.");

        // ==========================================
        // 🟠 CONFIGURATION DES POINTS DE REPÈRE ORANGES
        // ==========================================
        var orangeIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        var orangeMarker1 = L.marker(map.unproject([450, 200], 0), {icon: orangeIcon}).addTo(map);
        orangeMarker1.bindPopup("<b>Chantier Industriel</b><br>Zone de construction en cours.");

        var orangeMarker2 = L.marker(map.unproject([900, 450], 0), {icon: orangeIcon}).addTo(map);
        orangeMarker2.bindPopup("<b>Dépôt de Carburant</b><br>Ravitaillement principal.");

        // ==========================================
        // 🟣 CONFIGURATION DES POINTS DE REPÈRE VIOLETS
        // ==========================================
        var violetIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-violet.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        var violetMarker1 = L.marker(map.unproject([750, 850], 0), {icon: violetIcon}).addTo(map);
        violetMarker1.bindPopup("<b>Quartier VIP / Casino</b><br>Zone de divertissement nocturne.");

        var violetMarker2 = L.marker(map.unproject([350, 250], 0), {icon: violetIcon}).addTo(map);
        violetMarker2.bindPopup("<b>Laboratoire Secret</b><br>Recherches top-secret.");

        // ------------------------------------------

        // 3. Empêche les bugs de décalage au premier chargement complet
        setTimeout(function() {
            map.invalidateSize();
        }, 100);
    </script>

</body>
</html>
