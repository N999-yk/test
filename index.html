<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Carte Interactive</title>

    <!-- Chargement du design Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* Force la carte à prendre tout l'écran avec le fond bleu océan */
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #2c68a6; 
        }
    </style>
</head>
<body>

    <!-- Conteneur de la carte -->
    <div id="map"></div>

    <!-- Chargement du moteur Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Initialisation de la carte avec les niveaux de zoom et le système à plat
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: 0,
            maxZoom: 5
        });

        // Chargement des tuiles JPG avec l'ordre inversé et le paramètre tms
        L.tileLayer('{z}/{z},{y},{x}.jpg', {
            minZoom: 0,
            maxZoom: 5,
            tms: true,
            attribution: 'Leonida Project'
        }).addTo(map);

        // Limites élargies
        var southWest = map.unproject([-150, 1174], 0);
        var northEast = map.unproject([1174, -150], 0);
        var bounds = L.latLngBounds(southWest, northEast);
        map.setMaxBounds(bounds);
        
        // Centrage de base neutre
        var center = map.unproject([512, 512], 0);
        map.setView(center, 0);

        // Forçage absolu du décalage visuel après le chargement complet
        setTimeout(function() {
            map.invalidateSize();
            // Décale la vue de 150 pixels vers la droite pour recentrer l'île de force
            // (Si l'île bouge enfin, tu pourras ajuster ce '150' à la hausse ou à la baisse)
            map.panBy([-150, 0], {animate: false});
        }, 200);
    </script>

</body>
</html>
