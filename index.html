<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Carte Interactive</title>

    <!-- Chargement du design Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* Force la carte à prendre tout l'écran avec le fond bleu océan pour remplacer les tuiles manquantes */
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #265d8a; 
        }
    </style>
</head>
<body>

    <!-- Conteneur de la carte -->
    <div id="map"></div>

    <!-- Chargement du moteur Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Initialisation de la carte avec les niveaux de zoom et le système à plat
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: 0,
            maxZoom: 5
        });

        // Chargement des tuiles JPG avec l'ordre inversé et le paramètre tms
        L.tileLayer('{z}/{z},{y},{x}.jpg', {
            minZoom: 0,
            maxZoom: 5,
            tms: true,
            attribution: 'Ma carte interactive'
        }).addTo(map);

        // Centrage de la carte à l'ouverture (Niveau de zoom 1, centré sur la tuile Y:3, X:3)
        map.setView([3, 3], 1);
    </script>

</body>
</html>
